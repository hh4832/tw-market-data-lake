name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            pandas: "pandas==2.2.2"
          - python: "3.11"
            pandas: "pandas>=3,<4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (no finlab / fubon_neo; tests are offline)
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.pandas }}" -r requirements-dev.txt
      - name: pytest (SYNTHETIC_SMOKE_ONLY)
        run: python -m pytest -q
