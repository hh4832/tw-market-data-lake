[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-market-data-lake"
version = "0.1.0"
description = "Data-only ingestion of Taiwan stock/ETF FinLab daily data and Fubon 5-minute bars into Google Drive"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=1.26",
  "pyarrow>=14",
  "pyyaml>=6",
  "tqdm>=4.66",
]

[project.optional-dependencies]
finlab = ["finlab==2.0.18"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
